name: closeyourit
description: "Client Dart/Flutter per CloseYourIt — errori, metriche e logs verso il backend di osservabilità interno."
version: 0.10.1
homepage: https://closeyour.it/docs/sdk-dart
repository: https://github.com/bussolabs/closeyourit-dart-community

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  stack_trace: ^1.11.0
  dio: ^5.7.0
  # Il floor resta basso di proposito: il Flutter SDK pinna `meta` a una versione
  # ESATTA (1.17.0 su 3.38.1, 1.18.0 su 3.44.1), quindi chiedere `^1.19.0` renderebbe
  # il package irrisolvibile su ogni stable corrente (CYDA-17). Vincolo blindato in
  # test/workflow_policy_test.dart.
  meta: ^1.15.0
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.0
  path_provider: ^2.1.0
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.0
  fake_async: ^1.3.0
  crypto: ^3.0.7
  json_schema: ^5.2.2
  # Usati dai test che blindano workflow CI e vincoli di versione (CYDA-17).
  pub_semver: ^2.1.4
  yaml: ^3.1.2

topics:
  - observability
  - error-tracking
  - logging
  - monitoring
  - crash-reporting
